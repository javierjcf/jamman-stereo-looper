[package]
name = "jamman-cli"
description = "Herramienta de línea de comandos para el DigiTech JamMan Stereo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "jamman"
path = "src/main.rs"

[dependencies]
jamman-audio = { version = "0.1.0", path = "../jamman-audio" }
jamman-core = { path = "../jamman-core", features = ["serial"] }
tempfile = "3.27.0"
