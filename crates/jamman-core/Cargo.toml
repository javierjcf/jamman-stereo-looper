[package]
name = "jamman-core"
description = "Protocolo y formatos del pedal DigiTech JamMan Stereo (sin interfaz gráfica)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Conexión con el pedal por su puerto serie USB.
serial = ["dep:serialport"]
# Pedal simulado (`protocol::fake`) para los tests de otros crates.
testing = []

[dependencies]
serialport = { version = "4.10.1", optional = true }
uuid = { version = "1.28.0", features = ["v4"] }

# Lectura sin caché (`O_DIRECT`) para comprobar lo escrito en la tarjeta.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "upload_latency"
required-features = ["serial"]

[[example]]
name = "write_verify"
required-features = ["serial"]
