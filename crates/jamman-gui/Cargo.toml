[package]
name = "jamman-gui"
description = "Interfaz gráfica para gestionar los bucles del DigiTech JamMan Stereo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "jamman-gui"
path = "src/main.rs"

[dependencies]
jamman-core = { path = "../jamman-core" }
jamman-audio = { path = "../jamman-audio" }
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
fs4 = "1.1.0"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
